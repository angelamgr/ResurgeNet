<!DOCTYPE html>
<html lang="es">
    <head>
        <title> Gestion de comercios dados de alta </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style/estructura.css" />
        <link rel="stylesheet" type="text/css" href="style/admin_dashboard.css" />
        <link rel="stylesheet" type="text/css" href="style/gestion_cons_comer_admin.css" />
        <link rel="stylesheet" type="text/css" href="style/dashboard_validador.css" />

    </head>

    <body>
        <header>
            <h1 id="nombre"> ResurgeNet </h1>
            <a href="index.html"> <img id="logo" src="imagenes/logo .png"
                    alt="Imagen logo " width="80" height="80" /> </a>
            <img id="admin-icon" src="imagenes/foto_ini.png"
                alt="Icono Administrador" width="100" height="100" />
            <p> Validador C.</p>
        </header>

        <section class="form-container">
            <div class="main-card">
                <h2 class="titulo-listado">Listado de Comercios esperando
                    validación</h2>

                <div class="tabla-header">
                    <span class="header-nombre"></span>
                    <span class="motivo-solicitud">Motivo solicitud</span>
                    <span class="header-label">Aceptar</span>
                    <span class="header-label">Denegar</span>
                </div>

                <div class="comercios-container"></div>

                <div class="pagination-container">
                    <div class="nav-item">
                        <span class="flecha-nav">◀</span>
                        <span class="texto-nav">Anterior</span>
                    </div>
                    <div class="nav-item">
                        <span class="texto-nav">Siguiente</span>
                        <span class="flecha-nav">▶</span>
                    </div>
                </div>
            </div>
        </section>
        
        <button id="logout-btn" type="submit" name="hecho">Cerrar Sesión</button>

        <footer>
            <p>Quien somos</p>
            <p>Contacto</p>
        </footer>
         <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Mensaje</h3>
                <p>Información:</p>
                <ul id="errorList" class="error-list">
                </ul>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/solicitudesComercios.js"></script>
        <script src="js/cierre_sesion_admin.js"></script>
        <script src="js/evitar_atras.js"></script>
    </body>

</html>
