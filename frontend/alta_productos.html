<!DOCTYPE html>
<html lang="es">
    <head>
        <title> Alta de Productos - ResurgeNet </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style/estructura.css" />
        <link rel="stylesheet" type="text/css" href="style/alta_productos.css" />
    </head>
    <body>
        <header>
            <h1 id="nombre"> ResurgeNet </h1>
        </header>
        <main>
            <section class="form-container">
                <form id="altaProduForm" enctype="multipart/form-data">
                    <h2>Alta de Producto</h2>
                    <input type="text" name="nombre" placeholder="Nombre del producto">
                    <input type="text" name="tipo" placeholder="Tipo">
                    <input type="text" name="descripcion" placeholder="Descripción">
                    <input type="text" name="precio" placeholder="Precio (ej: 19.99)">
                    <input type="number" name="stock" placeholder="Stock">
                    <input type="file" name="imagen" accept="image/jpeg, image/png">
                    <button type="submit">Guardar producto</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Quien somos</p>
            <p>Contacto</p>
        </footer>
        <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Errores de Validación</h3>
                <ul id="errorList" class="error-list"></ul>
            </div>
        </div>
        <script src="js/config.js"></script>
        <script src="js/validacion_productos.js"></script>
    </body>
</html>
