<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Alta Productos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style/main.css" />
        <link rel="stylesheet" href="style/components.css" />
        <link rel="stylesheet" href="style/admin_dashboard.css" />
        <link rel="stylesheet" href="style/alta_productos.css" />
    </head>
    <body>
        <header>
            <h1 id="nombre">ResurgeNet</h1>
            <a href="index.html"><img id="logo" src="imagenes/logo .png" alt="Imagen logo" width="80" height="80" /></a>
            <img id="admin-icon" src="imagenes/foto_ini.png" alt="Icono Comercio" width="100" height="100" />
            <p>Nombre comercio</p>
        </header>
        <nav class="sidebar">
            <p class="toggle-btn">&#9776;</p>
            <ul class="menu-items">
                <li><a href="comercio_dashboard.html">Inicio</a></li>
                <li><a href="listado_productos_comercio.html">Listado de productos</a></li>
                <li><a href="actualizar_producto.html">Actualizacion de productos</a></li>
            </ul>
            <button id="logout-btn" type="button">Cerrar Sesion</button>
        </nav>
        <main>
            <h2>Alta de Productos</h2>
            <section class="form-container">
                <form id="altaProduForm">
                    <h3>Anade un nuevo producto</h3>
                    <div class="form-grid">
                        <div><label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre"></div>
                        <div><label for="tipo">Tipo</label><input type="text" id="tipo" name="tipo" /></div>
                        <div><label for="descripcion">Descripcion</label><input type="text" id="descripcion" name="descripcion" /></div>
                        <div><label for="precio">Precio</label><input type="text" id="precio" name="precio" /></div>
                        <div><label for="stock">Stock</label><input type="text" id="stock" name="stock" /></div>
                        <div><label for="imagen">Imagen</label><input type="file" id="imagen" name="imagen" accept="image/*" /></div>
                    </div>
                    <button type="submit">Guardar</button>
                </form>
            </section>
        </main>
        <footer><p>Quien somos</p><p>Contacto</p></footer>
        <div id="errorModal" class="modal"><div class="modal-content"><span class="close-button">&times;</span><h3>Mensaje</h3><ul id="errorList" class="error-list"></ul></div></div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/menu_dashboard.js"></script>
        <script src="js/validacion_productos.js"></script>
        <script src="js/cierre_sesion_admin.js"></script>
        <script src="js/evitar_atras.js"></script>
    </body>
</html>
