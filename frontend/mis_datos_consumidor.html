<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Mis Datos - ResurgeNet</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style/estructura.css" />
        <link rel="stylesheet" type="text/css" href="style/admin_dashboard.css" />
        <link rel="stylesheet" type="text/css" href="style/mis_datos_consumidor.css" />
    </head>

    <body>
        <header>
            <h1 id="nombre"> ResurgeNet </h1>
            <a href="index.html"><img id="logo" src="imagenes/logo .png" alt="Imagen logo" width="80" height="80" /></a>
            <img id="admin-icon" src="imagenes/foto_ini.png" alt="Icono Consumidor" width="100" height="100" />
            <p>Consumidor</p>
        </header>

        <nav class="sidebar">
            <p class="toggle-btn">&#9776;</p>
            <ul class="menu-items">
                <li><a href="consumidor_dashboard.html">Inicio</a></li>
                <li><a href="#">Mis pedidos</a></li>
            </ul>
            <button id="logout-btn" type="submit" name="hecho">Cerrar Sesión</button>
        </nav>

        <main>
            <h2>Modificación de tus datos</h2>
            <section class="form-container">
                <form id="misDatosForm">
                    <h3>Actualiza tu información personal</h3>

                    <div class="form-grid">
                        <div>
                            <label for="nombre_campo">Nombre</label>
                            <input type="text" id="nombre_campo" name="nombre" />
                        </div>
                        <div>
                            <label for="ciudad">Ciudad</label>
                            <input type="text" id="ciudad" name="ciudad" />
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" />
                        </div>
                        <div>
                            <label for="telefono">Nº Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" />
                        </div>
                        <div>
                            <label for="direccion">Dirección</label>
                            <input type="text" id="direccion" name="direccion" />
                        </div>
                        <div>
                            <label for="fecha_nacimiento">Fecha Nacimiento</label>
                            <input type="text" id="fecha_nacimiento" name="fecha_nacimiento" placeholder="DD/MM/AAAA" />
                        </div>
                        <div>
                            <label for="cod_postal">Cod. Postal</label>
                            <input type="text" id="cod_postal" name="cod_postal" />
                        </div>
                        <div>
                            <label for="contrasena">Contraseña</label>
                            <input type="password" id="contrasena" name="contrasena" />
                        </div>
                    </div>
                    <button type="submit" name="guardar">Guardar</button>
                </form>
            </section>
        </main>

        <footer>
            <p>Quien somos</p>
            <p>Contacto</p>
        </footer>

        <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Mensaje</h3>
                <p>Información:</p>
                <ul id="errorList" class="error-list"></ul>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/menu_dashboard.js"></script>
        <script src="js/cierre_sesion_admin.js"></script>
        <script src="js/evitar_atras.js"></script>
    </body>
</html>
