<!DOCTYPE html>
<html>
    <head>
        <title> Controles Administrador </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style/estructura.css" />
        <link rel="stylesheet" type="text/css"
            href="style/admin_dashboard.css" />

    </head>

    <body>
        <header>
            <h1 id="nombre"> ResurgeNet </h1>
            <img id="logo" src="imagenes/logo .png" alt="Imagen logo "
                width="80" height="80" />
            <img id="admin-icon" src="imagenes/foto_ini.png"
                alt="Icono Administrador" width="100" height="100" />
            <p> Administrador</p>
        </header>

        <nav class="sidebar">
            <p class="toggle-btn">☰</p>
            <ul class="menu-items">
                <li><a href="#">Gestion de Comercios</a></li>
                <li><a href="#">Gestion de Clientes</a></li>
                <li><a href="#">Buzón de Peticiones</a></li>

            </ul>
            <button id="logout-btn" type="submit" name="hecho">Cerrar Sesión</button>

        </nav>

        <main>
            <h2>Panel de Administración</h2>
            <p>Bienvenido al panel de administración. Despliega el menú para
                acceder a las funcionalidades.</p>
        </main>

        <footer>
            <p>Quien somos</p>
            <p>Contacto</p>
        </footer>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/admin_dashboard.js"></script>
        <script src="js/cierre_sesion_admin.js"></script>
        <script>
            window.addEventListener('pageshow', function(event) {
                if (event.persisted || window.performance.getEntriesByType('navigation')[0].type === 'back_forward') {
                    fetch('http://localhost:8080/api/checkUserSession', { credentials: 'include' })
                    .then(res => res.json())
                    .then(data => {
                        if (!data.active) {
                            window.location.href = 'index.html';
                        }
                    });
                }
            });
        </script>


    </body>

</html>
