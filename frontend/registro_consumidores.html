<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Registro</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style/main.css" />
        <link rel="stylesheet" href="style/components.css" />
        <link rel="stylesheet" href="style/incio_sesion.css" />
        <link rel="stylesheet" href="style/registro.css" />
    </head>
    <body>
        <header>
            <h1 id="nombre">ResurgeNet</h1>
            <a href="index.html"><img id="logo" src="imagenes/logo .png" alt="Imagen logo" width="80" height="80" /></a>
            <a href="inicio_sesion.html"><button type="button">Inicio Sesion</button></a>
        </header>
        <main>
            <section class="form-container">
                <form id="loginForm">
                    <h2>Crea tu cuenta</h2>
                    <div class="form-grid">
                        <div><label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre"></div>
                        <div><label for="email">Email</label><input type="email" id="email" name="email" /></div>
                        <div><label for="telefono">N Telefono</label><input type="tel" id="telefono" name="telefono" /></div>
                        <div><label for="direccion">Direccion</label><input type="text" id="direccion" name="direccion" /></div>
                        <div><label for="fecha_nacimiento">Fecha de nacimiento</label><input type="text" id="fecha_nacimiento" name="fecha_nacimiento" placeholder="DD/MM/AAAA" /></div>
                        <div><label for="cod_postal">Codigo postal</label><input type="text" id="cod_postal" name="cod_postal" /></div>
                        <div><label for="username">Nombre de usuario</label><input type="text" id="username" name="username"></div>
                        <div><label for="ciudad">Ciudad</label><input type="text" id="ciudad" name="ciudad" /></div>
                        <div><label for="password">Contrasena</label><input type="password" id="password" name="password" /></div>
                        <div class="empty-field"></div>
                    </div>
                    <button type="submit">Registro</button>
                </form>
            </section>
        </main>
        <footer><p>Quien somos</p><p>Contacto</p></footer>
        <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Errores de Validacion</h3>
                <ul id="errorList" class="error-list"></ul>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/validacion_registro.js"></script>
    </body>
</html>
