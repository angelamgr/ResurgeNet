<!DOCTYPE html>
<html lang="es">
    <head>
        <title> Registro - ResurgeNet </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style/estructura.css" />
        <link rel="stylesheet" type="text/css" href="style/registro.css" />
    </head>
    <body>
        <header>
            <h1 id="nombre"> ResurgeNet </h1>
            <a href="index.html"><img id="logo-header" src="imagenes/logo .png" alt="Imagen logo" width="80" height="80" /></a>
            <a href="inicio_sesion.html"><button type="button">Iniciar Sesión</button></a>
        </header>
        <main>
            <section class="form-container">
                <form id="loginForm">
                    <h2>Registro de Consumidor</h2>
                    <input type="text" name="nombre" placeholder="Nombre completo">
                    <input type="email" name="email" placeholder="Correo electrónico">
                    <input type="text" name="fecha_nacimiento" placeholder="Fecha de nacimiento (DD/MM/YYYY)">
                    <input type="text" name="ciudad" placeholder="Ciudad">
                    <input type="text" name="cod_postal" placeholder="Código postal">
                    <input type="text" name="direccion" placeholder="Dirección">
                    <input type="tel" name="telefono" placeholder="Teléfono">
                    <input type="text" name="username" placeholder="Nombre de usuario">
                    <input type="password" name="password" placeholder="Contraseña">
                    <button type="submit">Registrarse</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Quien somos</p>
            <p>Contacto</p>
        </footer>
        <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Errores de Validación</h3>
                <ul id="errorList" class="error-list"></ul>
            </div>
        </div>
        <script src="js/config.js"></script>
        <script src="js/validacion_registro.js"></script>
    </body>
</html>
