<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Trabaja con nosotros</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style/main.css" />
        <link rel="stylesheet" href="style/components.css" />
        <link rel="stylesheet" href="style/formulario_contacto_comercios.css" />
    </head>
    <body>
        <header>
            <h1 id="nombre">ResurgeNet</h1>
            <a href="index.html"><img id="logo" src="imagenes/logo .png" alt="Logo" width="80" height="80" /></a>
            <a href="inicio_sesion.html"><button type="button">Inicio Sesion</button></a>
        </header>
        <main>
            <section class="form-container">
                <section class="form-card">
                    <h2>Trabaja con nosotros</h2>
                    <form id="workForm" class="grid-form">
                        <input type="hidden" name="_token" value="{{ csrf_token() }}">
                        <div class="form-group"><label for="telefono">N Telefono</label><input type="tel" name="telefono" id="telefono"></div>
                        <div class="form-group"><label for="nombre_personal">Nombre personal</label><input type="text" name="nombre_personal" id="nombre_personal"></div>
                        <div class="form-group"><label for="nombre_comercio">Nombre comercio</label><input type="text" name="nombre_comercio" id="nombre_comercio"></div>
                        <div class="form-group span-2-rows"><label for="motivo">Motivo de solicitud</label><textarea name="motivo" id="motivo"></textarea></div>
                        <div class="form-group"><label for="email">Email</label><input type="email" name="email" id="email"></div>
                        <div class="form-group"><label for="ciudad">Ciudad</label><input type="text" name="ciudad" id="ciudad"></div>
                        <div class="form-group"><label for="web_operativa">Web operativa?</label><select name="web_operativa" id="web_operativa"><option value="">Selecciona una opcion</option><option value="si">Si</option><option value="no">No</option></select></div>
                        <div class="form-footer"><button type="submit" class="btn-submit">Enviar formulario</button></div>
                    </form>
                </section>
            </section>
        </main>
        <footer><p>Quien somos</p><p>Contacto</p></footer>
        <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Errores de Validacion</h3>
                <ul id="errorList" class="error-list"></ul>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/formulario_contacto_comercio.js"></script>
    </body>
</html>
