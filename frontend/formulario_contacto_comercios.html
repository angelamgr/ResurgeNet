<!DOCTYPE html>
<html lang="es">
    <head>
        <title> Contacto Comercios - ResurgeNet </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style/estructura.css" />
        <link rel="stylesheet" type="text/css" href="style/formulario_contacto_comercios.css" />
    </head>
    <body>
        <header>
            <h1 id="nombre"> ResurgeNet </h1>
            <a href="index.html"><img id="logo-header" src="imagenes/logo .png" alt="Imagen logo" width="80" height="80" /></a>
        </header>
        <main>
            <section class="form-container">
                <form id="workForm">
                    <h2>Trabaja con nosotros</h2>
                    <input type="text" name="nombre_personal" placeholder="Tu nombre">
                    <input type="text" name="nombre_comercio" placeholder="Nombre del comercio">
                    <input type="tel" name="telefono" placeholder="Teléfono">
                    <input type="email" name="email" placeholder="Correo electrónico">
                    <textarea name="motivo" placeholder="Motivo de la solicitud"></textarea>
                    <input type="text" name="ciudad" placeholder="Ciudad">
                    <select name="web_operativa">
                        <option value="">¿Tienes web operativa?</option>
                        <option value="si">Sí</option>
                        <option value="no">No</option>
                    </select>
                    <button type="submit" class="btn-submit">Enviar formulario</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Quien somos</p>
            <p>Contacto</p>
        </footer>
        <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Errores de Validación</h3>
                <ul id="errorList" class="error-list"></ul>
            </div>
        </div>
        <script src="js/config.js"></script>
        <script src="js/formulario_contacto_comercio.js"></script>
    </body>
</html>
