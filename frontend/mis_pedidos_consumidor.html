<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Mis Pedidos - ResurgeNet</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style/estructura.css" />
        <link rel="stylesheet" type="text/css" href="style/admin_dashboard.css" />
        <link rel="stylesheet" type="text/css" href="style/mis_pedidos_consumidor.css" />
    </head>

    <body>
        <header>
            <h1 id="nombre"> ResurgeNet </h1>
            <a href="index.html"><img id="logo" src="imagenes/logo .png" alt="Imagen logo" width="80" height="80" /></a>
            <img id="admin-icon" src="imagenes/foto_ini.png" alt="Icono Consumidor" width="100" height="100" />
            <p>Consumidor</p>
        </header>

        <nav class="sidebar">
            <p class="toggle-btn">&#9776;</p>
            <ul class="menu-items">
                <li><a href="consumidor_dashboard.html">Inicio</a></li>
                <li><a href="mis_datos_consumidor.html">Mis datos</a></li>
            </ul>
            <button id="logout-btn" type="submit" name="hecho">Cerrar Sesión</button>
        </nav>

        <main>
            <section class="form-container">
                <div class="main-card">
                    <h2 class="titulo-listado">Estado de mis pedidos</h2>

                    <div class="tabla-header">
                        <span class="col-id">Nº de pedido</span>
                        <span class="col-comercio">Nombre Comercio</span>
                        <span class="col-estado">Estado del pedido</span>
                    </div>

                    <div id="lista-pedidos">
                        <p class="sin-pedidos">Cargando pedidos...</p>
                    </div>

                    <div class="pagination-container">
                        <div class="nav-item" id="btn-anterior">
                            <span class="flecha-nav">&#9664;</span>
                            <span class="texto-nav">Anterior</span>
                        </div>
                        <div class="nav-item" id="btn-siguiente">
                            <span class="texto-nav">Siguiente</span>
                            <span class="flecha-nav">&#9654;</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>Quien somos</p>
            <p>Contacto</p>
        </footer>

        <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Mensaje</h3>
                <p>Información:</p>
                <ul id="errorList" class="error-list"></ul>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/menu_dashboard.js"></script>
        <script src="js/cierre_sesion_admin.js"></script>
        <script src="js/evitar_atras.js"></script>
        <script src="js/mis_pedidos_consumidor.js"></script>
    </body>
</html>
