<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Mis Pedidos - ResurgeNet</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style/main.css" />
        <link rel="stylesheet" href="style/components.css" />
        <link rel="stylesheet" href="style/admin_dashboard.css" />
        <link rel="stylesheet" href="style/mis_pedidos_consumidor.css" />
    </head>
    <body>
        <header>
            <h1 id="nombre">ResurgeNet</h1>
            <a href="index.html"><img id="logo" src="imagenes/logo .png" alt="Ir a inicio" width="80" height="80" /></a>
            <img id="admin-icon" src="imagenes/foto_ini.png" alt="" aria-hidden="true" width="100" height="100" />
            <p>Consumidor</p>
        </header>
        <button class="toggle-btn" aria-expanded="false" aria-controls="sidebar-nav" aria-label="Abrir menu">&#9776;</button>
        <nav class="sidebar" id="sidebar-nav">
            <ul class="menu-items">
                <li><a href="consumidor_dashboard.html">Inicio</a></li>
                <li><a href="mis_datos_consumidor.html">Mis datos</a></li>
            </ul>
            <button id="logout-btn" type="button">Cerrar Sesion</button>
        </nav>
        <main>
            <section class="form-container">
                <div class="main-card">
                    <h2 class="titulo-listado">Estado de mis pedidos</h2>
                    <table class="pedidos-table" aria-label="Listado de pedidos">
                        <thead><tr><th scope="col">N de pedido</th><th scope="col">Nombre Comercio</th><th scope="col">Estado del pedido</th></tr></thead>
                        <tbody id="lista-pedidos"><tr><td colspan="3" class="sin-pedidos">Cargando pedidos...</td></tr></tbody>
                    </table>
                    <div class="pagination-container">
                        <button class="nav-item" id="btn-anterior" aria-label="Pagina anterior"><span class="flecha-nav" aria-hidden="true">&#9664;</span><span class="texto-nav">Anterior</span></button>
                        <button class="nav-item" id="btn-siguiente" aria-label="Pagina siguiente"><span class="texto-nav">Siguiente</span><span class="flecha-nav" aria-hidden="true">&#9654;</span></button>
                    </div>
                </div>
            </section>
        </main>
        <footer><p>Quien somos</p><p>Contacto</p></footer>
        <div id="errorModal" class="modal" role="dialog" aria-modal="true"><div class="modal-content"><button class="close-button" aria-label="Cerrar">&times;</button><h3>Mensaje</h3><ul id="errorList" class="error-list"></ul></div></div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/menu_dashboard.js"></script>
        <script src="js/cierre_sesion_admin.js"></script>
        <script src="js/evitar_atras.js"></script>
        <script src="js/mis_pedidos_consumidor.js"></script>
    </body>
</html>
