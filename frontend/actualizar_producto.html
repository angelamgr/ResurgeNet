<!DOCTYPE html>
<html lang="es">
    <head>
        <title> Actualizar Producto - ResurgeNet </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style/estructura.css" />
        <link rel="stylesheet" type="text/css" href="style/alta_productos.css" />
    </head>
    <body>
        <header>
            <h1 id="nombre"> ResurgeNet </h1>
            <button id="logout-btn" type="button">Cerrar sesión</button>
        </header>
        <main>
            <section class="form-container">
                <form id="altaProduForm" enctype="multipart/form-data">
                    <h2>Actualizar Producto</h2>
                    <input type="text" id="nombre_prod" name="nombre" placeholder="Nombre del producto">
                    <input type="text" id="tipo" name="tipo" placeholder="Tipo">
                    <input type="text" id="descripcion" name="descripcion" placeholder="Descripción">
                    <input type="text" id="precio" name="precio" placeholder="Precio (ej: 19.99)">
                    <input type="number" id="stock" name="stock" placeholder="Stock">
                    <input type="file" id="imagen" name="imagen" accept="image/jpeg, image/png">
                    <button type="submit">Actualizar producto</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Quien somos</p>
            <p>Contacto</p>
        </footer>
        <div id="errorModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3>Información</h3>
                <ul id="errorList" class="error-list"></ul>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/preinfo_producto.js"></script>
        <script src="js/actualizar_prod.js"></script>
        <script src="js/cierre_sesion_admin.js"></script>
    </body>
</html>
