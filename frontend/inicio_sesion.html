<!DOCTYPE html>
<html>
    <head>
        <title> Logging </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style/estructura.css" />
        <link rel="stylesheet" type="text/css" href="style/incio_sesion.css" />
        
    </head>

    <body>
        <header>
            <h1 id="nombre"> ResurgeNet </h1>
            <img id="logo" src="imagenes/logo .png" alt="Imagen logo "
                width="80" height="80" />
            <button type="submit" name="hecho">Registro</button>
        </header>

        <main>

            <section class="form-container">
                <img id="logo" src="imagenes/icono_ini.png" alt="Imagen icono "
                    width="90" height="90" />
                    
                <form id="loginForm">
                    <input type="text" name="usuario"
                        placeholder="Nombre de usuario">
                    <input type="password" name="password"
                        placeholder="Contraseña" />

                    <button type="submit" name="hecho">Iniciar Sesión</button>

                    <h3>¿Has olvidado tu contraseña?</h3>
                </form>

            </section>
        </main>

        <footer>
            <p>Quien somos</p>
            <p>Contacto</p>
        </footer>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/login.js"></script>
    </body>

</html>
