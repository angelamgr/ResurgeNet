server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # Se usa variable para el upstream en lugar del nombre directamente.
        # Esto fuerza a Nginx a resolver el DNS en cada peticion en lugar
        # de hacerlo al arrancar, evitando el error "host not found in upstream"
        # cuando el contenedor backend aun no esta registrado en el DNS de Docker.
        # El resolver 127.0.0.11 es el DNS interno de Docker.
        resolver            127.0.0.11 valid=10s;
        set $backend_host   http://backend:80;
        proxy_pass          $backend_host;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_cookie_domain backend             localhost;
        proxy_cookie_path   /api                /api;
    }
}
