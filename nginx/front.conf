server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Archivos estaticos del frontend
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy inverso al backend Laravel.
    # location /api/ (con barra final) + proxy_pass http://backend:80/api/
    # hace que Nginx reenvie la URI completa sin modificarla.
    # Ejemplo: /api/loginUser -> http://backend:80/api/loginUser
    location /api/ {
        proxy_pass         http://backend:80/api/;

        # Pasa el host real del cliente (localhost:3000) a Laravel
        # para que las URLs generadas y las cookies usen el dominio correcto
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Reescribe el dominio de las cookies de sesion de 'backend' a 'localhost'
        # para que el navegador las acepte y las envie en peticiones siguientes
        proxy_cookie_domain backend localhost;
        proxy_cookie_path   /api    /api;
    }
}
