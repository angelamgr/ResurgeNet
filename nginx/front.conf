server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Archivos estaticos del frontend
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy inverso al backend Laravel.
    #
    # IMPORTANTE: proxy_pass SIN ruta explicita (solo host:puerto).
    # Cuando proxy_pass no tiene ruta, Nginx reenvía la URI original
    # completa sin modificarla:
    #   /api/loginUser  ->  http://backend:80/api/loginUser
    #
    # Si proxy_pass tuviera ruta (ej: http://backend:80/api/), Nginx
    # sustituiria el prefijo /api/ por /api/ resultando en /api/api/loginUser.
    #
    # Laravel espera /api/loginUser porque RouteServiceProvider añade
    # el prefijo 'api' a todas las rutas de routes/api.php.
    location /api/ {
        proxy_pass         http://backend:80;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cookie_domain backend localhost;
        proxy_cookie_path   /api /api;
    }
}
