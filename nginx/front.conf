server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # HTML sin cache: evita que bfcache restaure paginas autenticadas tras cerrar sesion.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy inverso al backend. Variable en proxy_pass para resolver DNS
    # en cada peticion (evita fallo de arranque si backend no esta disponible).
    # 127.0.0.11 es el resolver DNS interno de Docker.
    location /api/ {
        resolver            127.0.0.11 valid=10s;
        set $backend_host   http://backend:80;
        proxy_pass          $backend_host;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_cookie_domain backend             localhost;
        proxy_cookie_path   /api                /api;
    }
}
