server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Archivos estaticos del frontend
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy inverso: reenvia /api al contenedor backend.
    # El navegador ve un unico origen (localhost:3000) y no hay problema de CORS.
    # En produccion: cambiar http://backend:80 por la URL real del servidor backend.
    location /api {
        proxy_pass         http://backend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
