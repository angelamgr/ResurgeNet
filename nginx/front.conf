server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Archivos estaticos del frontend.
    # Las paginas HTML que requieren autenticacion (dashboards, formularios)
    # llevan cabeceras de no-cache para evitar que el navegador las restaure
    # desde bfcache al pulsar "atras" despues de cerrar sesion.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        try_files $uri $uri/ =404;
    }

    # CSS, JS e imagenes: se cachean normalmente (rendimiento)
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy inverso al backend Laravel.
    location /api/ {
        resolver            127.0.0.11 valid=10s;
        set $backend_host   http://backend:80;
        proxy_pass          $backend_host;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_cookie_domain backend             localhost;
        proxy_cookie_path   /api                /api;
    }
}
