version: '3.8'

services:
  webapp:
    image: nginx:latest
    container_name: webapp
    ports:
      - "8080:80"  # Nginx estará en el puerto 8080 en lugar del 80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - api
    networks:
      - my_network

  api:
    image: php:8.0-fpm
    container_name: api
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db
    networks:
      - my_network

  db:
    image: mysql:latest
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ResurgeNet
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./db_data:/var/lib/mysql  # Aquí se monta en ./db_data
    networks:
      - my_network


volumes:
  db_data:

networks:
  my_network:
    driver: bridge

