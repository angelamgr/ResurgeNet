version: '3.8'

services:
  frontend:
    image: nginx:latest
    container_name: frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/front.conf:/etc/nginx/conf.d/front.conf:ro
    networks:
      - my_network

  backend:
    image: nginx:latest
    container_name: backend
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
      - ./nginx/back.conf:/etc/nginx/conf.d/back.conf:ro
    depends_on:
      - api
    networks:
      - my_network

  api:
    build: ./api
    container_name: api
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db
    networks:
      - my_network

  db:
    image: mysql:latest
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ResurgeNet
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

